<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 200" width="1240" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- wagon underframe, wheels and coupler (wagon is 170 wide) -->
    <g id="gear">
      <rect x="0" y="148" width="170" height="8" fill="#0A1524"/>
      <rect x="170" y="141" width="14" height="6" fill="#0A1524"/>
      <g fill="#0A1524" stroke="#8FA3B8" stroke-width="2">
        <circle cx="28" cy="167" r="10"/><circle cx="52" cy="167" r="10"/>
        <circle cx="118" cy="167" r="10"/><circle cx="142" cy="167" r="10"/>
      </g>
      <g fill="#8FA3B8">
        <circle cx="28" cy="167" r="3"/><circle cx="52" cy="167" r="3"/>
        <circle cx="118" cy="167" r="3"/><circle cx="142" cy="167" r="3"/>
      </g>
    </g>
    <path id="ribs" d="M28 76v68M56 76v68M84 76v68M112 76v68M140 76v68" stroke="#000" stroke-opacity=".2" stroke-width="3"/>
  </defs>

  <!-- ballast, sleepers and rail -->
  <rect x="0" y="182" width="1240" height="18" fill="#0A1524"/>
  <path d="M0 191H1240" stroke="#2C435C" stroke-width="8" stroke-dasharray="12 16"/>
  <rect x="0" y="178" width="1240" height="4" fill="#8FA3B8"/>

  <!-- overhead wire -->
  <line x1="0" y1="26" x2="1240" y2="26" stroke="#4C6580" stroke-width="2"/>

  <!-- wagon 1: steel -->
  <g transform="translate(10 0)">
    <rect x="0" y="72" width="170" height="76" rx="3" fill="#8E3B2B"/>
    <rect x="-2" y="68" width="174" height="8" rx="2" fill="#6B2A1F"/>
    <use href="#ribs" xlink:href="#ribs"/>
    <rect x="22" y="92" width="126" height="34" rx="2" fill="#0F2236" fill-opacity=".38"/>
    <text x="85" y="118" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2" fill="#F7EBDD">STEEL</text>
    <text x="85" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E8CDBB">BOXN 41027</text>
    <use href="#gear" xlink:href="#gear"/>
  </g>

  <!-- wagon 2: cement -->
  <g transform="translate(192 0)">
    <rect x="0" y="72" width="170" height="76" rx="3" fill="#44566A"/>
    <rect x="-2" y="68" width="174" height="8" rx="2" fill="#2F3E50"/>
    <use href="#ribs" xlink:href="#ribs"/>
    <rect x="22" y="92" width="126" height="34" rx="2" fill="#0F2236" fill-opacity=".38"/>
    <text x="85" y="118" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2" fill="#EAF0F6">CEMENT</text>
    <text x="85" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#B9C7D5">BCNHL 36518</text>
    <use href="#gear" xlink:href="#gear"/>
  </g>

  <!-- wagon 3: coal -->
  <g transform="translate(374 0)">
    <rect x="0" y="72" width="170" height="76" rx="3" fill="#8E3B2B"/>
    <rect x="-2" y="68" width="174" height="8" rx="2" fill="#6B2A1F"/>
    <use href="#ribs" xlink:href="#ribs"/>
    <rect x="22" y="92" width="126" height="34" rx="2" fill="#0F2236" fill-opacity=".38"/>
    <text x="85" y="118" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2" fill="#F7EBDD">COAL</text>
    <text x="85" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E8CDBB">BOXN 41233</text>
    <use href="#gear" xlink:href="#gear"/>
  </g>

  <!-- wagon 4: urea -->
  <g transform="translate(556 0)">
    <rect x="0" y="72" width="170" height="76" rx="3" fill="#44566A"/>
    <rect x="-2" y="68" width="174" height="8" rx="2" fill="#2F3E50"/>
    <use href="#ribs" xlink:href="#ribs"/>
    <rect x="22" y="92" width="126" height="34" rx="2" fill="#0F2236" fill-opacity=".38"/>
    <text x="85" y="118" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2" fill="#EAF0F6">UREA</text>
    <text x="85" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#B9C7D5">BCNHL 36902</text>
    <use href="#gear" xlink:href="#gear"/>
  </g>

  <!-- wagon 5: grain -->
  <g transform="translate(738 0)">
    <rect x="0" y="72" width="170" height="76" rx="3" fill="#8E3B2B"/>
    <rect x="-2" y="68" width="174" height="8" rx="2" fill="#6B2A1F"/>
    <use href="#ribs" xlink:href="#ribs"/>
    <rect x="22" y="92" width="126" height="34" rx="2" fill="#0F2236" fill-opacity=".38"/>
    <text x="85" y="118" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2" fill="#F7EBDD">GRAIN</text>
    <text x="85" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E8CDBB">BCNHL 37144</text>
    <use href="#gear" xlink:href="#gear"/>
  </g>

  <!-- electric locomotive -->
  <g>
    <rect x="908" y="141" width="16" height="6" fill="#0A1524"/>
    <!-- pantograph touching the wire -->
    <path d="M1040 62L1062 36H1098L1120 62" fill="none" stroke="#C9D6E3" stroke-width="3" stroke-linejoin="round"/>
    <path d="M1050 26H1110" stroke="#C9D6E3" stroke-width="4" stroke-linecap="round"/>
    <path d="M1062 36L1070 26M1098 36L1090 26" stroke="#C9D6E3" stroke-width="2.5"/>
    <!-- body -->
    <path d="M922 150V76Q922 62 938 62H1176Q1190 62 1198 72L1228 110V150Z" fill="#1F4E79"/>
    <rect x="922" y="122" width="306" height="10" fill="#F2A413"/>
    <!-- windscreen -->
    <path d="M1186 74L1212 104H1186Z" fill="#CFE3F2"/>
    <!-- vents -->
    <g fill="#173C5E">
      <rect x="944" y="80" width="24" height="34" rx="2"/>
      <rect x="980" y="80" width="24" height="34" rx="2"/>
      <rect x="1016" y="80" width="24" height="34" rx="2"/>
      <rect x="1052" y="80" width="24" height="34" rx="2"/>
      <rect x="1088" y="80" width="24" height="34" rx="2"/>
      <rect x="1124" y="80" width="24" height="34" rx="2"/>
    </g>
    <rect x="922" y="150" width="306" height="8" fill="#0A1524"/>
    <g fill="#0A1524" stroke="#8FA3B8" stroke-width="2">
      <circle cx="960" cy="167" r="11"/><circle cx="990" cy="167" r="11"/>
      <circle cx="1160" cy="167" r="11"/><circle cx="1190" cy="167" r="11"/>
    </g>
    <g fill="#8FA3B8">
      <circle cx="960" cy="167" r="3.5"/><circle cx="990" cy="167" r="3.5"/>
      <circle cx="1160" cy="167" r="3.5"/><circle cx="1190" cy="167" r="3.5"/>
    </g>
  </g>
</svg>
