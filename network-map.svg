<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" width="600" height="310" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g font-family="Barlow, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#0F2236">
